name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 app src tests
      - name: Tests
        run: pytest -q
