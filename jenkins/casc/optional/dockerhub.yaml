# Enabled by jenkins/entrypoint.sh only when DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set.
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              description: "Docker Hub access token for image push"
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_TOKEN}"
